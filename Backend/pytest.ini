[pytest]
testpaths = tests
pythonpath = ..
tmp_path_retention_policy = none
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    ci: Approved deterministic CI contract (initial exact inventory: 41 tests)
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试
