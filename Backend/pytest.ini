[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
markers =
    unit: 单元测试
    integration: 集成测试
    api: API测试
    slow: 慢速测试

# 强制离线环境变量 - 确保测试时使用本地模型
# 注意：pytest.ini不支持env配置，需要通过conftest.py或其他方式设置
