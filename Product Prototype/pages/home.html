<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首页 · 搜索 - XU-News AI</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script type="module">
    import { createApp, ref } from "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js";
    import { Navbar } from "../components/navbar.js";
    import { SiteFooter } from "../components/footer.js";
    createApp({
      components: { Navbar, SiteFooter },
      setup(){
        const query = ref("");
        const tags = ["今日要闻","AI 大模型","中美贸易","新能源","资本市场"];
        const toSearch = () => {
          const q = encodeURIComponent(query.value || 'AI 大模型最新动态');
          window.location.href = `results.html?q=${q}`;
        };
        return { query, tags, toSearch };
      }
    }).mount('#app');
  </script>
</head>
<body>
  <div id="app" v-cloak>
    <Navbar></Navbar>
    <main class="container">
      <section class="hero">
        <div class="grid" style="gap:16px;">
          <div>
            <h1>智能新闻检索与 RAG 问答</h1>
            <p>支持语义检索、重排、溯源与置信度展示，助你快速获得可信答案。</p>
          </div>
          <div class="card">
            <div class="card-pad">
              <div class="search-bar">
                <input class="input" placeholder="输入问题或关键词，如：过去一年AI投融资走势" v-model="query" @keyup.enter="toSearch" />
                <button class="btn primary" @click="toSearch">搜索</button>
              </div>
              <div class="tags" style="margin-top:10px;">
                <div class="tag" v-for="t in tags" :key="t" @click="query=t"># {{ t }}</div>
              </div>
              <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
                <a href="qa.html" class="btn ghost">直接去问答</a>
                <a href="upload.html" class="btn ghost">上传我的文档</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <SiteFooter></SiteFooter>
  </div>
  
  <!-- 加载状态 -->
  <div class="app-loading" id="loading">
    <div class="spinner"></div>
    <div class="text">加载中...</div>
  </div>
  
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
