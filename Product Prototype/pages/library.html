<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的知识库 - RAG News Intelligence Platform</title>
  <link rel="stylesheet" href="../assets/styles.css">
  <script type="module">
    import { createApp, ref, onMounted } from "https://unpkg.com/vue@3/dist/vue.esm-browser.prod.js";
    import { Navbar } from "../components/navbar.js";
    import { SiteFooter } from "../components/footer.js";
    createApp({
      components: { Navbar, SiteFooter },
      setup(){
        const docs = ref([]);
        const loading = ref(true);
        const sel = ref(new Set());
        onMounted(()=>{
          setTimeout(()=>{
            docs.value = Array.from({length: 6}).map((_,i)=>({
              id: i+1,
              name: `报告_${i+1}.pdf`,
              chunks: 120 + i*8,
              status: '已向量化',
              updated: '2025-01-10'
            }));
            loading.value = false;
          }, 400);
        });
        const toggle = (id) => { sel.value.has(id) ? sel.value.delete(id) : sel.value.add(id); };
        const remove = () => { docs.value = docs.value.filter(d=>!sel.value.has(d.id)); sel.value.clear(); };
        return { docs, loading, sel, toggle, remove };
      }
    }).mount('#app');
  </script>
</head>
<body>
  <div id="app" v-cloak>
    <Navbar></Navbar>
    <main class="container" style="padding:20px 0;">
      <div class="card">
        <div class="card-pad">
          <div style="display:flex; align-items:center; gap:10px;">
            <h2 style="margin:0;">我的知识库</h2>
            <div class="spacer"></div>
            <a class="btn" href="upload.html">上传新文档</a>
            <button class="btn" @click="remove">批量删除</button>
          </div>
          <div v-if="loading" style="margin-top:12px;">加载中…</div>
          <div v-else class="list" style="margin-top:12px;">
            <label class="item" v-for="d in docs" :key="d.id" style="display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;">
              <input type="checkbox" :checked="sel.has(d.id)" @change="toggle(d.id)" />
              <div>
                <strong>{{ d.name }}</strong>
                <div class="meta">分块 {{ d.chunks }} · {{ d.status }} · {{ d.updated }}</div>
              </div>
              <a class="btn ghost" :href="`qa.html?q=${encodeURIComponent(d.name)}`">用此文档问答</a>
            </label>
          </div>
        </div>
      </div>
    </main>
    <SiteFooter></SiteFooter>
  </div>
  
  <!-- 加载状态 -->
  <div class="app-loading" id="loading">
    <div class="spinner"></div>
    <div class="text">加载中...</div>
  </div>
  
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
</body>
</html>
